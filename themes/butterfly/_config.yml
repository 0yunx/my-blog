# --------------------------------------
# Hexo Butterfly Theme Configuration
# If you have any questions, please refer to the documentation
# Chinese: https://butterfly.js.org/
# English: https://butterfly.js.org/en/
# --------------------------------------

# --------------------------------------
# Navigation Settings
# --------------------------------------

nav:
  # Navigation bar logo image
  logo: 
  display_title: true
  display_post_title: true
  # Whether to fix navigation bar
  fixed: true
  bg: "#FF69B4" # 使用主题主色调（热粉色）
  text_color: "#ffffff" # 白色文字
  hover_color: "#FFB6C1" # 浅粉色悬停效果

# 菜单配置（格式：菜单名: 路径 || 图标类）
# 支持二级菜单（缩进两个空格）
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  # 留言板: /comments/ || fas fa-comments
  关于: /about/ || fas fa-user

# --------------------------------------
# Code Blocks Settings
# --------------------------------------

code_blocks:
  # Code block theme: darker / pale night / light / ocean / false
  theme: light
  macStyle: false
  # Code block height limit (unit: px)
  height_limit: false
  word_wrap: false

  # Toolbar
  copy: true
  language: true
  # true: shrink the code blocks | false: expand the code blocks | none: expand code blocks and hide the button
  shrink: false
  fullpage: false

# Social media links
# Formal:
#   icon: link || the description || color
social:
  fab fa-github: https://github.com/0yunx || Github || '#FF69B4'
  # fa-solid fa-code: https://blog.csdn.net/weixin_74811095 || CSDN || '#FF69B4'
  fa-solid fa-codeforces: https://codeforces.com/profile/yun123456 || Codeforces || '#FF69B4'
  fab fa-bilibili: https://space.bilibili.com/1639097420 || bilibili || '#FF69B4'



# --------------------------------------
# Image Settings
# --------------------------------------

# --------------------------------------
# 图片设置
# --------------------------------------
favicon: https://img.187360.xyz/img/dieqi.jpg # 网站图标（favicon）
# 头像设置
avatar:
  img: /img/02.jpg  # 头像图片路径
  effect: true     # 是否启用头像特效（如旋转等）
disable_top_img: false # 是否禁用所有顶部横幅图片
default_top_img: rgba(0, 0, 0, 0) # 当页面未设置横幅图片时显示的默认背景（此处设置为透明）
index_img: # 首页横幅图片（留空则使用默认）
archive_img: # 归档页横幅图片（留空则使用默认）
tag_img: # 标签页横幅图片（注意：单个标签页，非标签集合页）
tag_per_img: # 为特定标签设置独立横幅图片
# 格式：
#  - 标签名: 图片路径
category_img: # 分类页横幅图片（注意：单个分类页，非分类集合页）
category_per_img: # 为特定分类设置独立横幅图片
# 格式：
#  - 分类名: 图片路径
footer_img: rgba(45, 10, 61, 0.2)  # 页脚背景图片（true表示启用主题默认，也可指定路径）
background: https://img.187360.xyz/img/dieqi.jpg # 网站背景（支持颜色值或图片路径）
# 封面图片设置
cover:
  index_enable: true  # 首页是否启用封面
  aside_enable: true  # 侧边栏是否启用封面
  archives_enable: true  # 归档页是否启用封面
  default_cover: https://img.187360.xyz/img/dieqi.jpg  # 默认封面图片（当未设置封面时使用）
# 图片加载失败时的替代图片
error_img:
  flink: https://img.187360.xyz/img/dieqi.jpg      # 友链页面错误图片
  post_page: https://img.187360.xyz/img/dieqi.jpg  # 文章页面错误图片
# 404页面设置
error_404:
  enable: true            # 是否启用自定义404页面
  subtitle: '页面不存在'   # 404提示文字
  background: https://img.187360.xyz/img/dieqi.jpg  # 404背景图片
# Instant.page 预加载技术
# https://instant.page/
instantpage: false  # 是否启用页面预加载
# 图片懒加载配置
# https://github.com/verlok/vanilla-lazyload
lazyload:
  enable: false  # 是否启用懒加载
  # 指定应用懒加载的范围（全站 site 或仅文章 post）
  field: site
  placeholder:  # 懒加载占位图路径
  blur: false   # 是否启用模糊效果

post_meta:
  # 首页设置
  page:
    date_type: created    # 显示日期类型：created（创建时间）/updated（更新时间）/both（两者）
    date_format: date     # 日期格式：date（完整日期）/relative（相对时间，如"2天前"）
    categories: true      # 是否显示分类
    tags: true           # 是否显示标签
    label: true           # 是否显示标签样式
  # 文章页设置
  post:
    position: center        # 元数据显示位置：left（左）/center（中）
    date_type: both       # 显示日期类型
    date_format: date     # 日期格式
    categories: true      # 是否显示分类
    tags: true            # 是否显示标签
    label: true           # 是否显示标签样式

# --------------------------------------
# Index page settings
# --------------------------------------

# The top_img settings of home page
# default: top img - full screen, site info - middle
# The position of site info, eg: 300px/300em/300rem/10%

# 首页设置
# --------------------------------------
# 默认top_img全屏，site_info在中间
# 使用默认, 都无需填写（建议默认）
index_site_info_top:  110px # 主页标题距离顶部距离  例如 300px/300em/300rem/10%
index_top_img_height: 300px #主页top_img高度 例如 300px/300em/300rem  不能使用百分比

# 首页副标题设置
subtitle:
  enable: true       # 是否启用副标题
  effect: true       # 是否启用打字机效果
  loop: true         # 是否循环播放打字机效果
  # 自定义打字机效果配置（基于typed.js）
  # 官方配置文档：https://github.com/mattboldt/typed.js/#customization
  typed_option:
  # 第三方文案来源（目前仅支持中文）
  # 会先显示来源标识，再显示下方sub中的内容
  # 可选值：false/1/2/3
  # false - 禁用此功能
  # 1 - 使用 hitokoto.cn 的API
  # 2 - 使用 https://api.aa1.cn/doc/yiyan.html 的API
  # 3 - 使用 jinrishici.com 的API
  source: true
  # 如果关闭打字机效果，将只显示sub中的第一条内容
  sub:
    - '<i class="fas fa-quote-left"></i> 学无止境'
    - '<i class="fas fa-quote-left"></i> 千里之行，始于足下 —— 老子'
    - '<i class="fas fa-quote-left"></i> 读书破万卷，下笔如有神'
    - '<i class="fas fa-quote-left"></i> 吾日三省吾身'
    - '<i class="fas fa-quote-left"></i> 星光不问赶路人，时光不负有心人'
    - '<i class="fas fa-quote-left"></i> 人生没有白走的路，每一步都算数'
    - '<i class="fas fa-quote-left"></i> 保持热爱，奔赴山海'
    - '<i class="fas fa-quote-left"></i> 纸上得来终觉浅，绝知此事要躬行'
    - '<i class="fas fa-quote-left"></i> 成功的秘诀在于坚持'
    - '<i class="fas fa-quote-left"></i> The best way to predict the future is to invent it'
    - '<i class="fas fa-quote-left"></i> 生活是一场马拉松，你需要不断地奔跑'
    - '<i class="fas fa-quote-left"></i> 成功不是将来才有的，而是从决定去做的那一刻起，持续累积而成'


# 首页文章布局方式
# 1: 封面图在左，信息在右
# 2: 封面图在右，信息在左
# 3: 封面图与信息左右交替排列
# 4: 封面图在上，信息在下
# 5: 信息直接显示在封面图上
# 6: 瀑布流布局 - 封面图在上，信息在下
# 7: 瀑布流布局 - 信息直接显示在封面图上
index_layout: 6

# 首页文章摘要显示设置
# 1: 显示文章描述的description
# 2: 智能显示（存在description则显示，否则显示自动截取的内容）
# 3: 自动截取内容（默认，从前N个字符截取）
# false: 不显示文章摘要
index_post_content:
  method: 1         # 选择摘要显示方式
  length: 300       # 当method为2或3时，指定截取长度（单位：字符）

# --------------------------------------
# Post Settings
# --------------------------------------

toc:
  post: true
  page: false
  number: true
  expand: false
  # Only for post
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Sponsor/reward
reward:
  enable: false
  text:
  QR_code:
    # - img: /img/wechat.jpg
    #   link:
    #   text: wechat
    # - img: /img/alipay.jpg
    #   link:
    #   text: alipay

# Post edit
# Easily browse and edit blog source code online.
post_edit:
  enable: false
  # url: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/
  # For example: https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  url:

# Related Articles
related_post:
  enable: true
  # Number of posts displayed
  limit: 6
  # Choose: created / updated
  date_type: created

# Choose: 1 / 2 / false
# 1: The 'next post' will link to old post
# 2: The 'next post' will link to new post
# false: disable pagination
post_pagination: 1

# Displays outdated notice for a post
noticeOutdate:
  enable: false
  # Style: simple / flat
  style: flat
  # When will it be shown
  limit_day: 365
  # Position: top / bottom
  position: top
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

# --------------------------------------
# Footer Settings
# --------------------------------------
footer:
  nav:
  owner:
    enable: true
    since: 2025
  # Copyright of theme and framework
  copyright: false
    # enable: true
    # version: true
  custom_text: |  # 自定义页脚文本（支持HTML）
    <style>
      .footer {
        text-align: center;
        position: relative;
      }
      .social-links {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: wrap;
      }
      .social-links i {
        color: #8400ff;
      }
      .social-link {
        color: #8a2be2;
        font-size: 1.2rem;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        background: rgba(138, 43, 226, 0.1);
      }
      .social-link:hover {
        color: #892be294;
        background: #892be294;
        transform: translateY(-3px) scale(1.2);
        box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
        text-decoration: none !important; 
      }
      .footer p {
        margin: 0.5rem 0;
        line-height: 1;
      }
      .copyright {
        font-size: 1.1rem; 
        color: #c08bdf;
        font-weight: 400;
      }
      .tagline {
        font-size: 0.8rem;
        color: #8a2be2;
        font-style: italic;
        font-weight: 500;
      }
      .visitor-count {
        font-size: 0.75rem;
        color: rgba(219, 142, 255, 0.658);
        font-weight: 300;
      }
      #visitorCount {
        font-weight: bold;
      }
    </style>
    <div class="footer">
      <div class="social-links">
        <a href="https://github.com/0yunx" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://space.bilibili.com/1639097420" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="bilibili" title="bilibili">
          <i class="fab fa-bilibili"></i>
        </a>
      </div>
      <p class="copyright">© 2025 khuatcoungのblog - 所有权利保留</p>
      <p class="tagline">> Stay curious, stay hacking, stay anime! <</p>
      <p class="visitor-count">访问量: <span id="visitorCount">1024</span> | 你是第 <span id="dailyVisitor">1</span> 位今日访客</p>
    </div>
    <script>
      // 确保DOM加载完成后执行
      document.addEventListener('DOMContentLoaded', function() {
        // 模拟访问量增长
        function updateVisitorCount() {
          const countElement = document.getElementById('visitorCount');
          let count = parseInt(countElement.textContent) || 1024;
          // 从localStorage获取或初始化计数
          const storedCount = localStorage.getItem('totalVisitors');
          if (storedCount) {
            count = parseInt(storedCount);
            countElement.textContent = count;
          }
          // 每日访客计数
          const today = new Date().toDateString();
          const dailyData = JSON.parse(localStorage.getItem('dailyVisitors') || '{"date":"", "count":0}');
          if (dailyData.date !== today) {
            dailyData.date = today;
            dailyData.count = 0;
          }
          dailyData.count += 1;
          document.getElementById('dailyVisitor').textContent = dailyData.count;
          localStorage.setItem('dailyVisitors', JSON.stringify(dailyData));
          // 每30秒随机增加访问量
          setInterval(() => {
            count += Math.floor(Math.random() * 3);
            countElement.textContent = count;
            localStorage.setItem('totalVisitors', count.toString());
          }, 30000);
        }
        updateVisitorCount();
        // 添加点击动画效果
        const socialLinks = document.querySelectorAll('.social-link');
        socialLinks.forEach(link => {
          link.addEventListener('click', function() {
            this.style.transform = 'scale(0.9)';
            setTimeout(() => {
              this.style.transform = '';
            }, 300);
          });
        });
      });
    </script>



# --------------------------------------
# Aside Settings
# --------------------------------------

aside:
  enable: true  # 是否启用侧边栏
  hide: false # 是否默认隐藏侧边栏
  # Show the button to hide the aside in bottom right button
  button: true # 是否在右下角显示隐藏侧边栏的按钮
  mobile: true  # 在移动端是否显示
  # Position: left / right
  position: left
  display:
    archive: true  # 归档
    tag: true # 标签
    category: true # 分类
  card_author:
    enable: true  # 是否显示作者卡片
    description:  # 作者描述（支持HTML）
    button: # 关注按钮
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://www.187360.xyz/
  card_announcement:
    enable: true # 是否显示公告卡片
    content: This is my Blog
  card_recent_post:
    enable: true
    # If set 0 will show all
    limit: 3
    # Sort: date / updated
    sort: date
    sort_order: 4
  # 最新评论卡片
  card_newest_comments:
    enable: false
    sort_order:
    limit: 6
    # Unit: mins, save data to localStorage
    storage: 10
    avatar: true
  card_categories:
    enable: true
    # If set 0 will show all
    limit: 8
    # Choose: none / true / false
    expand: none
    sort_order:
  card_tags:
    enable: true
    # If set 0 will show all
    limit: 40
    color: false
    custom_colors:
    # Order of tags, random/name/length
    orderby: random
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: 1
    sort_order:
  card_archives:
    enable: true
    # Type: monthly / yearly
    type: monthly
    # Eg: YYYY年MM月
    format: MMMM YYYY
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: -1
    # If set 0 will show all
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    # The title shows the series name
    series_title: false
    # Order by title or date
    orderBy: 'date'
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    # Time difference between publish date and now
    # Formal: Month/Day/Year Time or Year/Month/Day Time
    # Leave it empty if you don't enable this feature
    runtime_date:

# --------------------------------------
# Bottom right button
# --------------------------------------

# The distance between the bottom right button and the bottom (default unit: px)
rightside_bottom:

# Conversion between Traditional and Simplified Chinese
translate:
  enable: false
  # The text of a button
  default: 繁
  # the language of website (1 - Traditional Chinese/ 2 - Simplified Chinese）
  defaultEncoding: 2
  # Time delay
  translateDelay: 0
  # The text of the button when the language is Simplified Chinese
  msgToTraditionalChinese: '繁'
  # The text of the button when the language is Traditional Chinese
  msgToSimplifiedChinese: '簡'

# Read Mode
readmode: true

# Dark Mode
darkmode:
  enable: true
  # Toggle Button to switch dark/light mode
  button: true
  # Switch dark/light mode automatically
  # autoChangeMode: 1  Following System Settings, if the system doesn't support dark mode, it will switch dark mode between 6 pm to 6 am
  # autoChangeMode: 2  Switch dark mode between 6 pm to 6 am
  # autoChangeMode: false
  autoChangeMode: false
  # Set the light mode time. The value is between 0 and 24. If not set, the default value is 6 and 18
  start:
  end:

# Show scroll percent in scroll-to-top button
rightside_scroll_percent: true  # 是否在返回顶部按钮中显示滚动百分比 

# 除非你知道这些设置的工作原理，否则不要修改以下设置 
# 选择要在右下角显示的功能项，选项包括：readmode（阅读模式）、translate（繁简转换）、darkmode（暗黑模式）、hideAside（隐藏侧边栏）、toc（目录）、chat（聊天）、comment（评论） 
# 不要重复使用相同的值 
rightside_item_order:
  enable: false
  # Default: readmode,translate,darkmode,hideAside
  hide:
  # Default: toc,chat,comment
  show:

# Animation for the bottom right config button
rightside_config_animation: true

# --------------------------------------
# Global Settings
# --------------------------------------

anchor:
  # When you scroll, the URL will update according to header id.
  auto_update: false
  # Click the headline to scroll and update the anchor
  click_to_scroll: false

photofigcaption: false

# Need to install the hexo-wordcount plugin

# Busuanzi count for PV / UV in site
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# --------------------------------------
# Math
# --------------------------------------

# About the per_page
# if you set it to true, it will load mathjax/katex script in each page
# if you set it to false, it will load mathjax/katex script according to your setting (add the 'mathjax: true' or 'katex: true' in page's front-matter)
math:
  # Choose: mathjax, katex
  # Leave it empty if you don't need math
  use:
  per_page: true
  hide_scrollbar: false

  mathjax:
    # Enable the contextual menu
    enableMenu: true
    # Choose: all / ams / none, This controls whether equations are numbered and how
    tags: none

  katex:
    # Enable the copy KaTeX formula
    copy_tex: false

# --------------------------------------
# Search
# --------------------------------------

search: 
  # 选择搜索方式：algolia_search（Algolia 搜索） / local_search（本地搜索） / docsearch（Docsearch 搜索） 
  # 若不需要搜索功能，留空即可。 
  use: local_search
  # 搜索框默认提示文字（支持多语言）
  placeholder: "输入关键词…" 
 
  # Algolia 搜索配置 
  algolia_search: 
    # 每页显示的搜索结果数量 
    hitsPerPage: 6 
 
  # 本地搜索配置 
  local_search: 
    enable: true      # 是否启用本地搜索
    # 界面文本定制
    labels:
      input_placeholder: "输入关键词…" 
      hits_empty: "没有找到与「${query}」相关的内容 😭"  # 空搜索结果提示
    # 动画效果配置
    animation: 
      enable: true    # 是否启用动画效果
      duration: 0.3   # 动画持续时间（秒）
    # 是否在页面加载时预加载搜索数据，设置为 true 预加载，false 不预加载 
    preload: ture 
    # 每篇文章显示的前 n 条搜索结果，设置为 -1 显示所有结果 
    top_n_per_article: 1 
    # 是否将 HTML 字符串转换为可读文本，设置为 true 转换，false 不转换 
    unescape: false 
    # 本地搜索所需的 CDN 地址 
    CDN: 


  # Docsearch
  # https://docsearch.algolia.com/
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# Share System
# --------------------------------------

share:
  # Choose: sharejs / addtoany
  # Leave it empty if you don't need share
  use: sharejs

  # Share.js
  # https://github.com/overtrue/share.js
  sharejs:
    sites: facebook,x,wechat,weibo,qq

  # AddToAny
  # https://www.addtoany.com/
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# --------------------------------------
# Comments System
# --------------------------------------

comments:
  # Up to two comments system, the first will be shown as default
  # Leave it empty if you don't need comments
  # Choose: Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
  # Format of two comments system : Disqus,Waline
  use: giscus
  # Display the comment name next to the button
